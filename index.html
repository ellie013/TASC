<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式拖曳排課系統 (專業安全版)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase App & Firestore SDK (v10) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        /* 隱藏捲軸但保留捲動功能 */
        .no-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
        .no-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .no-scrollbar::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        .no-scrollbar::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        
        /* 唯讀模式下停用抓取手勢 */
        .read-only-mode .cursor-grab { cursor: default !important; }

        .droppable.drag-over {
            background-color: #e0f2fe !important;
            border: 2px dashed #0284c7 !important;
        }
        
        @keyframes pulse-red {
            0%, 100% { background-color: #fee2e2; }
            50% { background-color: #fca5a5; }
        }
        .conflict {
            animation: pulse-red 2s infinite;
            border: 2px solid #ef4444 !important;
        }
        
        .sticky-col-shadow { box-shadow: 2px 0 5px -2px rgba(0,0,0,0.1); }
        .sticky-row-shadow { box-shadow: 0 2px 5px -2px rgba(0,0,0,0.1); }

        /* 列印最佳化設定 */
        @media print {
            @page { size: portrait; margin: 0.8cm; }
            body, main { height: auto !important; overflow: visible !important; background-color: white !important; }
            
            body:not(.print-mode-teacher):not(.print-mode-payroll):not(.print-mode-single-payroll) #print-only-container { display: none !important; }
            
            body.print-mode-teacher > *:not(#print-only-container) { display: none !important; }
            body.print-mode-teacher #print-only-container { display: block !important; width: 100%; }
            
            body.print-mode-payroll > *:not(#print-payroll-container) { display: none !important; }
            body.print-mode-payroll #print-payroll-container { display: block !important; width: 100%; }

            body.print-mode-single-payroll > *:not(#print-single-payroll-container) { display: none !important; }
            body.print-mode-single-payroll #print-single-payroll-container { display: block !important; width: 100%; }
            
            .print-page-break { page-break-before: always; }
            .payroll-box { page-break-inside: avoid; border: 1px solid #000; margin-bottom: 20px; padding: 15px; border-radius: 8px; }
            .payroll-signature { margin-top: 30px; display: flex; justify-content: flex-end; }
        }

        @keyframes instance-glow {
            0%, 100% { box-shadow: 0 0 4px #3b82f6, inset 0 0 4px rgba(59, 130, 246, 0.3); }
            50% { box-shadow: 0 0 16px #3b82f6, inset 0 0 8px rgba(59, 130, 246, 0.5); }
        }
        .highlighted-instance {
            animation: instance-glow 2s infinite;
            border: 2px solid #2563eb !important;
            transform: scale(1.02);
            z-index: 30 !important;
        }

        .no-teacher-alert {
            border: 2px dashed #ef4444 !important;
            background-color: #fef2f2 !important;
        }
    </style>
</head>
<body class="bg-gray-100 h-screen w-screen overflow-hidden flex flex-col font-sans text-gray-800" onclick="clearHighlightOnBackground(event)">

    <!-- 列印專用容器 -->
    <div id="print-only-container" class="hidden"></div>
    <div id="print-payroll-container" class="hidden"></div>
    <div id="print-single-payroll-container" class="hidden"></div>

    <!-- 頂部標題與控制列 -->
    <header class="flex justify-between items-center bg-white px-4 py-2 shadow-sm border-b border-gray-200 shrink-0 z-40 print:hidden">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                📅 互動式拖曳排課系統 
            </h1>
            <span id="role-badge" onclick="toggleAdminMode()" class="cursor-pointer bg-amber-100 text-amber-800 text-xs px-2 py-0.5 rounded font-bold hover:opacity-80 transition-opacity shadow-sm" title="點擊切換管理權限">📡 系統啟動中...</span>
            
            <div class="admin-btn hidden flex items-center gap-1.5 text-xs bg-gray-50 border border-gray-200 p-1.5 rounded shadow-inner">
                <span class="text-gray-600 font-bold">📅 第一週(一) 起始日期:</span>
                <input type="date" id="schedule-start-date" class="border border-gray-300 rounded p-0.5 focus:outline-none focus:ring-1 focus:ring-indigo-500" value="2025-07-07" onchange="updateScheduleDates(); saveToCloud();">
            </div>

            <!-- ✨ 升級功能：停課日排除器 -->
            <div class="admin-btn hidden flex items-center gap-1.5 text-xs bg-red-50 border border-red-200 p-1.5 rounded shadow-inner" title="在此輸入停課日期，結算時將自動扣除鐘點費。例如: 7/8, 7/15">
                <span class="text-red-700 font-bold">☔ 停課日扣除 (不計薪):</span>
                <input type="text" id="suspend-dates-input" class="border border-red-300 rounded p-0.5 focus:outline-none focus:ring-1 focus:ring-red-500 text-center w-[120px]" placeholder="如: 7/8, 7/15" onchange="updatePayrollUI(); saveToCloud();">
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="openPayrollModal()" class="admin-btn hidden px-3 py-1.5 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 rounded transition text-sm font-medium border border-indigo-200">
                💰 印領清冊
            </button>
            <button onclick="saveToCloud()" class="admin-btn hidden px-3 py-1.5 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded transition text-sm font-medium border border-blue-200">
                💾 儲存進度至雲端
            </button>
            <button onclick="loadFromCloud()" class="admin-btn hidden px-3 py-1.5 bg-purple-50 text-purple-600 hover:bg-purple-100 rounded transition text-sm font-medium border border-purple-200">
                📂 強制重新載入
            </button>
            <button onclick="openImportModal()" class="admin-btn hidden px-3 py-1.5 bg-green-50 text-green-700 hover:bg-green-100 rounded transition text-sm font-medium border border-green-200">
                📥 貼上資料
            </button>
            <button onclick="openTeacherScheduleModal()" class="px-3 py-1.5 bg-yellow-50 text-yellow-700 hover:bg-yellow-100 rounded transition text-sm font-medium border border-yellow-200 shadow-sm">
                🧑‍🏫 老師課表
            </button>
            <button onclick="resetSchedule()" class="admin-btn hidden px-3 py-1.5 bg-red-50 text-red-600 hover:bg-red-100 rounded transition text-sm font-medium border border-red-200">
                🗑️ 清空課表
            </button>
            <button onclick="window.print()" class="px-3 py-1.5 bg-gray-50 text-gray-700 hover:bg-gray-200 rounded transition text-sm font-medium border border-gray-300 ml-2">
                🖨️ 列印班級
            </button>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-1 flex flex-row overflow-hidden p-2 gap-2 print:p-0 print:m-0">
        <div class="w-[80%] flex flex-col min-w-0 flex-shrink-0 print:w-full print:block">
            <div class="flex justify-center mb-2 shrink-0 print:hidden">
                <div class="inline-flex bg-gray-200 rounded-lg p-1 shadow-inner">
                    <button id="btn-view-a" onclick="switchView('A')" class="px-8 py-1 bg-blue-600 text-white font-bold rounded-md shadow-sm text-sm tracking-widest">
                        甲班課表
                    </button>
                    <button id="btn-view-b" onclick="switchView('B')" class="px-8 py-1 text-gray-600 font-bold rounded-md hover:bg-gray-300 text-sm tracking-widest">
                        乙班課表
                    </button>
                </div>
            </div>

            <!-- 視圖 A (甲班) -->
            <div id="view-a" class="flex-1 flex flex-row gap-2 overflow-hidden">
                <section class="flex-1 flex flex-col bg-white border border-gray-300 rounded shadow-sm overflow-hidden min-w-[300px]">
                    <div class="bg-blue-600 text-white py-1.5 font-bold text-center text-sm tracking-widest shrink-0">甲班 - 第一週</div>
                    <div class="flex-1 overflow-auto relative no-scrollbar bg-gray-50" id="table-a-w1-container"></div>
                </section>
                <section class="flex-1 flex flex-col bg-white border border-gray-300 rounded shadow-sm overflow-hidden min-w-[300px]">
                    <div class="bg-blue-600 text-white py-1.5 font-bold text-center text-sm tracking-widest shrink-0">甲班 - 第二週</div>
                    <div class="flex-1 overflow-auto relative no-scrollbar bg-gray-50" id="table-a-w2-container"></div>
                </section>
            </div>

            <!-- 視圖 B (乙班) -->
            <div id="view-b" class="hidden flex-1 flex flex-row gap-2 overflow-hidden">
                <section class="flex-1 flex flex-col bg-white border border-gray-300 rounded shadow-sm overflow-hidden min-w-[300px]">
                    <div class="bg-green-600 text-white py-1.5 font-bold text-center text-sm tracking-widest shrink-0">乙班 - 第一週</div>
                    <div class="flex-1 overflow-auto relative no-scrollbar bg-gray-50" id="table-b-w1-container"></div>
                </section>
                <section class="flex-1 flex flex-col bg-white border border-gray-300 rounded shadow-sm overflow-hidden min-w-[300px]">
                    <div class="bg-green-600 text-white py-1.5 font-bold text-center text-sm tracking-widest shrink-0">乙班 - 第二週</div>
                    <div class="flex-1 overflow-auto relative no-scrollbar bg-gray-50" id="table-b-w2-container"></div>
                </section>
            </div>
        </div>

        <!-- 右欄：待排課程庫 -->
        <aside id="sidebar-container" class="w-[20%] bg-white border border-gray-300 rounded shadow-sm flex flex-col shrink-0 min-w-[200px] print:hidden">
            <div class="bg-gray-700 text-white py-1.5 font-bold text-center text-sm flex justify-between items-center px-3 shrink-0">
                <span id="pool-title">📚 甲班課程庫 (待排)</span>
                <div>
                    <button onclick="promptClearPool()" class="admin-btn hidden text-xs bg-red-600 hover:bg-red-500 px-2 py-0.5 rounded border border-red-500 mr-1" title="清空課程庫">🗑️</button>
                    <button onclick="addNewCourse()" class="admin-btn hidden text-xs bg-gray-600 hover:bg-gray-500 px-2 py-0.5 rounded border border-gray-500" title="新增課程">+</button>
                </div>
            </div>
            <div id="sidebar-help-text" class="bg-yellow-50 text-yellow-800 text-[11px] p-1.5 text-center border-b border-yellow-200 leading-tight">
                將卡片拖至左側。雙擊課表卡片可微調該堂助教。<br>點擊「老師名稱」可高亮老師的課。
            </div>
            <div id="pool-container" class="flex-1 overflow-y-auto p-2 space-y-2 bg-gray-50 droppable pb-20"
                 ondragover="allowDrop(event)" ondrop="dropToPool(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)">
            </div>
        </aside>
    </main>

    <!-- ✨ 鐘點費印領清冊 Modal -->
    <div id="payroll-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-[70] print:hidden">
        <div class="bg-white rounded-lg p-5 w-[980px] max-w-[98vw] h-[90vh] max-h-[95vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="flex justify-between items-center mb-2 border-b pb-2 shrink-0">
                <h2 class="text-xl font-bold text-indigo-800 flex items-center gap-2">💰 鐘點費印領清冊與憑證黏存單產生器</h2>
                <button onclick="closePayrollModal()" class="text-gray-500 hover:text-red-500 text-2xl font-bold leading-none">&times;</button>
            </div>
            
            <div class="bg-indigo-50/70 p-3 rounded-lg border border-indigo-100 grid grid-cols-4 gap-3 text-xs mb-3 shrink-0">
                <div class="col-span-2">
                    <label class="block font-bold text-gray-700 mb-1">工作計畫名稱</label>
                    <input type="text" id="payroll-project-name" class="w-full border border-gray-300 rounded p-1" value="114年夏日樂學計畫方案-本土語文活動課程及方案二整合式學習方案" oninput="updatePayrollUI()">
                </div>
                <div>
                    <label class="block font-bold text-indigo-900 mb-1">統計班別</label>
                    <select id="payroll-class-select" class="w-full border border-indigo-300 bg-indigo-50 rounded p-1 font-bold text-indigo-800" onchange="onPayrollClassChange()">
                        <option value="A">甲班</option>
                        <option value="B">乙班</option>
                    </select>
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-1">班別註記 (顯示於核銷單)</label>
                    <input type="text" id="payroll-class-note" class="w-full border border-gray-300 rounded p-1" value="甲班" oninput="updatePayrollUI()">
                </div>
                
                <div>
                    <label class="block font-bold text-gray-700 mb-1">年度 (民國)</label>
                    <input type="number" id="payroll-year" class="w-full border border-gray-300 rounded p-1" value="114" oninput="updatePayrollUI()">
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-1">主教單價 (元/節)</label>
                    <input type="number" id="payroll-main-rate" class="w-full border border-gray-300 rounded p-1" value="400" oninput="updatePayrollUI()">
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-1">助教單價 (元/節)</label>
                    <input type="number" id="payroll-ta-rate" class="w-full border border-gray-300 rounded p-1" value="200" oninput="updatePayrollUI()">
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-1">用途摘要</label>
                    <input type="text" id="payroll-abstract" class="w-full border border-gray-300 rounded p-1" value="內聘講師鐘點費及機關負擔健保補充保費" oninput="updatePayrollUI()">
                </div>

                <div>
                    <label class="block font-bold text-gray-700 mb-1">選擇統計老師</label>
                    <select id="payroll-teacher-select" class="w-full border border-gray-300 rounded p-1 font-bold text-indigo-800" onchange="onPayrollTeacherChange()">
                    </select>
                </div>
                <div>
                    <label class="block font-bold text-indigo-900 mb-1">講師身分證字號</label>
                    <input type="text" id="payroll-teacher-id" class="w-full border border-indigo-200 bg-indigo-50/50 rounded p-1" placeholder="例如: A123456789" oninput="saveTeacherInfo()">
                </div>
                <div class="col-span-2">
                    <label class="block font-bold text-indigo-900 mb-1">講師戶籍地址</label>
                    <input type="text" id="payroll-teacher-address" class="w-full border border-indigo-200 bg-indigo-50/50 rounded p-1" placeholder="例如: 彰化縣芬園鄉..." oninput="saveTeacherInfo()">
                </div>
                
                <!-- Google Sheets API URL -->
                <div class="col-span-4 bg-yellow-50 p-2 rounded border border-yellow-200">
                    <label class="block font-bold text-yellow-800 mb-1">🔗 Google Sheets API 網址 (部署 Web App 後取得的 URL)</label>
                    <input type="text" id="payroll-gas-url" class="w-full border border-yellow-300 rounded p-1 text-xs" placeholder="請貼上 https://script.google.com/macros/s/.../exec">
                </div>
                
                <div class="flex items-center gap-4 col-span-4 pt-1 border-t border-indigo-100">
                    <label class="flex items-center gap-1 font-bold text-gray-700 cursor-pointer">
                        <input type="checkbox" id="payroll-is-internal" checked onchange="updatePayrollUI()">
                        講師為本機關投保人員 (內聘，免扣補充保費自付額)
                    </label>
                    <label class="flex items-center gap-1 font-bold text-gray-700 cursor-pointer">
                        <input type="checkbox" id="payroll-is-union" onchange="updatePayrollUI()">
                        參加職業工會 (免扣補充自付額，需檢附證明)
                    </label>
                </div>
            </div>

            <div class="flex border-b border-gray-200 mb-2 shrink-0 text-sm">
                <button id="tab-payroll-single" onclick="switchPayrollTab('single')" class="py-2 px-6 font-bold border-b-2 border-indigo-600 text-indigo-700">📄 1人單面含支出憑證黏存單</button>
                <button id="tab-payroll-summary" onclick="switchPayrollTab('summary')" class="py-2 px-6 font-bold border-b-2 border-transparent text-gray-500 hover:text-indigo-600">📊 全員彙整統計總清單</button>
            </div>

            <div class="flex-1 overflow-auto bg-gray-100 p-4 rounded border border-gray-200 no-scrollbar relative">
                <div id="payroll-single-preview" class="space-y-4"></div>
                <div id="payroll-summary-preview" class="hidden">
                    <div id="payroll-summary-container"></div>
                </div>
            </div>
            
            <div class="flex justify-end gap-3 mt-3 pt-2 border-t shrink-0">
                <button onclick="closePayrollModal()" class="px-5 py-2 bg-gray-200 text-gray-700 rounded font-bold hover:bg-gray-300 transition-colors">關閉視窗</button>
                <button id="btn-export-gas" onclick="exportToGoogleSheets()" class="px-6 py-2 bg-green-600 text-white rounded font-bold hover:bg-green-700 shadow-sm flex items-center gap-2 transition-all">
                    📤 匯出此人簽呈至 Google Sheets
                </button>
                <button id="btn-print-payroll" onclick="printActivePayroll()" class="px-6 py-2 bg-indigo-600 text-white rounded font-bold hover:bg-indigo-700 shadow-sm flex items-center gap-2 transition-colors">
                    🖨️ 列印報表 (自動排版)
                </button>
            </div>
        </div>
    </div>

    <!-- 編輯課程庫預設資訊 Modal -->
    <div id="edit-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-50 print:hidden">
        <div class="bg-white rounded-lg p-5 w-[380px] shadow-xl">
            <h2 class="text-lg font-bold mb-3 text-gray-800 border-b pb-2">編輯課程預設資訊</h2>
            <div class="mb-3">
                <label class="block text-xs font-bold text-gray-700 mb-1">單元名稱</label>
                <input type="text" id="edit-unit" class="w-full border border-gray-300 rounded p-1.5 text-sm">
            </div>
            <div class="flex gap-2 mb-3">
                <div class="flex-1">
                    <label class="block text-xs font-bold text-gray-700 mb-1">總堂數</label>
                    <input type="number" id="edit-total" min="1" class="w-full border border-gray-300 rounded p-1.5 text-sm">
                </div>
                <div class="flex-1">
                    <label class="block text-xs font-bold text-gray-700 mb-1">主教老師</label>
                    <input type="text" id="edit-main-teacher" class="w-full border border-gray-300 rounded p-1.5 text-sm">
                </div>
            </div>
            <div class="mb-4">
                <label class="block text-xs font-bold text-gray-700 mb-1">預設助教 (逗號分隔)</label>
                <input type="text" id="edit-tas" class="w-full border border-gray-300 rounded p-1.5 text-sm">
            </div>
            <div class="flex justify-between items-center mt-4 pt-3 border-t border-gray-100">
                <button onclick="promptDeleteCourse()" class="px-3 py-1.5 text-red-600 hover:bg-red-50 rounded text-sm font-bold">🗑️ 刪除</button>
                <div class="flex gap-2">
                    <button onclick="closeModal()" class="px-4 py-1.5 bg-gray-100 text-gray-700 hover:bg-gray-200 rounded text-sm font-bold">取消</button>
                    <button onclick="saveCourseEdit()" class="px-4 py-1.5 bg-blue-600 text-white hover:bg-blue-700 rounded text-sm font-bold">儲存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 雙擊微調單堂師資 Modal -->
    <div id="edit-instance-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-50 print:hidden">
        <div class="bg-white rounded-lg p-5 w-[380px] shadow-xl">
            <h2 class="text-lg font-bold mb-3 text-gray-800 border-b pb-2 flex justify-between items-center">
                <span>✏️ 微調單堂課師資</span>
                <span class="text-xs bg-blue-100 text-blue-800 px-2 py-0.5 rounded-full font-normal" id="instance-location-badge"></span>
            </h2>
            <div class="mb-3">
                <label class="block text-xs font-bold text-gray-700 mb-1">單元名稱</label>
                <input type="text" id="instance-unit" disabled class="w-full bg-gray-100 border border-gray-300 rounded p-1.5 text-gray-500 text-sm">
            </div>
            <div class="mb-3">
                <label class="block text-xs font-bold text-gray-700 mb-1">本堂課主教</label>
                <input type="text" id="instance-main-teacher" class="w-full border border-gray-300 rounded p-1.5 text-sm">
            </div>
            <div class="mb-4">
                <label class="block text-xs font-bold text-gray-700 mb-1">本堂課助教 (逗號分隔)</label>
                <input type="text" id="instance-tas" class="w-full border border-gray-300 rounded p-1.5 text-sm">
            </div>
            <div class="flex justify-end gap-2 mt-4 pt-3 border-t border-gray-100">
                <button onclick="closeInstanceModal()" class="px-4 py-1.5 bg-gray-100 text-gray-700 hover:bg-gray-200 rounded text-sm font-bold">取消</button>
                <button onclick="saveInstanceEdit()" class="px-4 py-1.5 bg-blue-600 text-white hover:bg-blue-700 rounded text-sm font-bold">確認修改</button>
            </div>
        </div>
    </div>

    <!-- 匯入與確認彈窗 -->
    <div id="import-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-50 print:hidden">
        <div class="bg-white rounded-lg p-6 w-[600px] shadow-xl">
            <h2 id="import-modal-title" class="text-lg font-bold mb-2 text-gray-800">從 Google Sheets 貼上資料</h2>
            <textarea id="import-textarea" class="w-full h-40 border border-gray-300 rounded p-2 text-sm whitespace-pre" placeholder="勇闖八卦&#9;4&#9;王小明, 李大華"></textarea>
            <div class="flex justify-end gap-2 mt-4">
                <button onclick="closeImportModal()" class="px-4 py-1.5 bg-gray-100 text-gray-700 hover:bg-gray-200 rounded text-sm font-bold">取消</button>
                <button onclick="processImport()" class="px-4 py-1.5 bg-green-600 text-white hover:bg-green-700 rounded text-sm font-bold">確認匯入</button>
            </div>
        </div>
    </div>

    <div id="reset-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-50 print:hidden">
        <div class="bg-white rounded-lg p-6 w-[350px] shadow-xl text-center">
            <h2 class="text-lg font-bold mb-2 text-gray-800">確定要清空課表嗎？</h2>
            <div class="flex justify-center gap-3 mt-4">
                <button onclick="closeResetModal()" class="px-5 py-2 bg-gray-100 text-gray-700 hover:bg-gray-200 rounded font-bold">取消</button>
                <button onclick="executeReset()" class="px-5 py-2 bg-red-600 text-white hover:bg-red-700 rounded font-bold">確認清空</button>
            </div>
        </div>
    </div>

    <div id="delete-course-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-[60] print:hidden">
        <div class="bg-white rounded-lg p-6 w-[350px] shadow-xl text-center">
            <h2 class="text-lg font-bold mb-2 text-red-600">確定要徹底刪除此課程？</h2>
            <div class="flex justify-center gap-3 mt-4">
                <button onclick="closeDeleteCourseModal()" class="px-5 py-2 bg-gray-100 text-gray-700 hover:bg-gray-200 rounded font-bold">取消</button>
                <button onclick="executeDeleteCourse()" class="px-5 py-2 bg-red-600 text-white hover:bg-red-700 rounded font-bold">確認刪除</button>

    <div id="clear-pool-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-[60] print:hidden">
        <div class="bg-white rounded-lg p-6 w-[350px] shadow-xl text-center">
            <h2 class="text-lg font-bold mb-2 text-red-600">確定要清空課程庫嗎？</h2>
            <p class="text-sm text-gray-600"><span id="clear-pool-class-name" class="font-bold"></span> 的所有未排及已排課程將被清除。</p>
            <div class="flex justify-center gap-3 mt-4">
                <button onclick="closeClearPoolModal()" class="px-5 py-2 bg-gray-100 text-gray-700 hover:bg-gray-200 rounded font-bold">取消</button>
                <button onclick="executeClearPool()" class="px-5 py-2 bg-red-600 text-white hover:bg-red-700 rounded font-bold">確認清空</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none print:hidden"></div>

    <script>
        // ==========================================
        // 🔒 1. 權限與 Firebase 設定
        // ==========================================
        const ADMIN_PASSWORD = "123"; 

        // ⚠️⚠️⚠️ 請在這裡貼上您的 Firebase 金鑰 ⚠️⚠️⚠️
          const firebaseConfig = {
      apiKey: "AIzaSyBg7cePx7eMeU1hATC5AtLskSJayr2jl04",
      authDomain: "tasc-schedule.firebaseapp.com",
      projectId: "tasc-schedule",
      storageBucket: "tasc-schedule.firebasestorage.app",
      messagingSenderId: "829044730170",
      appId: "1:829044730170:web:0d5c864d9b90340d200803"
        };

        let db = null;
        let isAdmin = false;
        let payrollActiveTab = "single"; 
        let teacherMetadata = {}; 
        let googleGasUrl = ""; // 自訂儲存 Google Apps Script URL

        function toggleAdminMode() {
            if (isAdmin) {
                isAdmin = false;
                document.body.classList.add('read-only-mode');
                document.getElementById('role-badge').innerText = "👁️ 唯讀展示模式";
                document.getElementById('role-badge').className = "cursor-pointer bg-blue-100 text-blue-800 text-xs px-2 py-0.5 rounded font-bold hover:bg-blue-200 transition-colors shadow-sm";
                document.getElementById('sidebar-help-text').innerHTML = "💡 唯讀模式下無法修改課表。您可以點擊老師姓名高亮追蹤特定師資課表。";
                document.querySelectorAll('.admin-btn').forEach(btn => btn.classList.add('hidden'));
                
                const url = new URL(window.location);
                url.searchParams.delete('admin');
                window.history.pushState({}, '', url);
                showToast("🔒 已登出，切換為唯讀模式", "info");
                deserializeState(JSON.parse(JSON.stringify(serializeState())));
            } else {
                const pwd = prompt("請輸入管理員密碼以解鎖編輯權限：");
                if (pwd === ADMIN_PASSWORD) {
                    isAdmin = true;
                    document.body.classList.remove('read-only-mode');
                    document.getElementById('role-badge').innerText = "✍️ 管理員模式";
                    document.getElementById('role-badge').className = "cursor-pointer bg-green-100 text-green-800 text-xs px-2 py-0.5 rounded font-bold hover:bg-green-200 transition-colors shadow-sm";
                    document.getElementById('sidebar-help-text').innerHTML = "將卡片拖至左側。雙擊課表卡片可微調該堂助教。<br>點擊「老師名稱」可高亮老師的課。";
                    document.querySelectorAll('.admin-btn').forEach(btn => btn.classList.remove('hidden'));
                    
                    const url = new URL(window.location);
                    url.searchParams.set('admin', ADMIN_PASSWORD);
                    window.history.pushState({}, '', url);
                    showToast("🔓 密碼正確！已解鎖所有編輯與存檔權限", "success");
                    deserializeState(JSON.parse(JSON.stringify(serializeState())));
                } else if (pwd !== null) {
                    showToast("❌ 密碼錯誤", "error");
                }
            }
        }

        function checkPermissionsAndInitFirebase() {
            const urlParams = new URLSearchParams(window.location.search);
            const adminQuery = urlParams.get('admin');
            
            if (adminQuery === ADMIN_PASSWORD) {
                isAdmin = true;
                document.body.classList.remove('read-only-mode');
                document.querySelectorAll('.admin-btn').forEach(btn => btn.classList.remove('hidden'));
                document.getElementById('role-badge').innerText = "✍️ 管理員模式";
                document.getElementById('role-badge').className = "cursor-pointer bg-green-100 text-green-800 text-xs px-2 py-0.5 rounded font-bold hover:bg-green-200 transition-colors shadow-sm";
                document.getElementById('sidebar-help-text').innerHTML = "將卡片拖至左側。雙擊課表卡片可微調該堂助教。<br>點擊「老師名稱」可高亮老師的課。";
            } else {
                isAdmin = false;
                document.body.classList.add('read-only-mode');
                document.getElementById('role-badge').innerText = "👁️ 唯讀展示模式";
                document.getElementById('role-badge').className = "cursor-pointer bg-blue-100 text-blue-800 text-xs px-2 py-0.5 rounded font-bold hover:bg-blue-200 transition-colors shadow-sm";
                document.getElementById('sidebar-help-text').innerHTML = "💡 唯讀模式下無法修改課表。您可以點擊老師姓名高亮追蹤特定師資課表。";
            }

            if (firebaseConfig.projectId && firebaseConfig.apiKey) {
                try {
                    firebase.initializeApp(firebaseConfig);
                    db = firebase.firestore();
                    loadFromCloud();
                } catch(e) {
                    console.error(e);
                    showToast("☁️ 雲端服務載入失敗，使用本機最新狀態", "warning");
                }
            } else {
                if (document.getElementById('role-badge').innerText.includes('啟動中')) {
                    document.getElementById('role-badge').innerText = isAdmin ? "✍️ 管理員模式 (無雲端)" : "👁️ 唯讀展示模式 (無雲端)";
                }
            }
        }

        // ==========================================
        // 📅 起始日期 & 課表日期格線動態計算
        // ==========================================
        function getScheduleDate(dayIndex) {
            const startDateInput = document.getElementById('schedule-start-date');
            if (!startDateInput) return "";
            const baseDate = new Date(startDateInput.value);
            if (isNaN(baseDate.getTime())) return "";
            
            let daysOffset = dayIndex;
            if (dayIndex >= 5) {
                daysOffset = dayIndex + 2;
            }
            
            const targetDate = new Date(baseDate);
            targetDate.setDate(baseDate.getDate() + daysOffset);
            
            return `${targetDate.getMonth() + 1}/${targetDate.getDate()}`;
        }

        function updateScheduleDates() {
            document.querySelectorAll('.schedule-date-label').forEach(el => {
                const d = parseInt(el.dataset.day);
                el.innerText = getScheduleDate(d);
            });
            if (document.getElementById('payroll-modal') && !document.getElementById('payroll-modal').classList.contains('hidden')) {
                updatePayrollUI();
            }
        }

        function formatDatesChinese(daysSet) {
            if (!daysSet || daysSet.size === 0) return "";
            const sortedDays = Array.from(daysSet).sort((a,b)=>a-b);
            const startDateInput = document.getElementById('schedule-start-date');
            const baseDate = new Date(startDateInput.value);
            if (isNaN(baseDate.getTime())) return "";
            
            let monthMap = {};
            sortedDays.forEach(dayIndex => {
                let offset = dayIndex >= 5 ? dayIndex + 2 : dayIndex;
                let d = new Date(baseDate);
                d.setDate(baseDate.getDate() + offset);
                let m = d.getMonth() + 1;
                let date = d.getDate();
                if(!monthMap[m]) monthMap[m] = [];
                monthMap[m].push(date);
            });
            
            let result = [];
            for (let m in monthMap) {
                result.push(`${m}月${monthMap[m].join('、')}日`);
            }
            return result.join('，');
        }

        // ==========================================
        // 🎨 2. 核心資料結構與基礎渲染
        // ==========================================
        const courseColors = [
            { bg: '#eff6ff', border: '#bfdbfe' }, { bg: '#f0fdf4', border: '#bbf7d0' },
            { bg: '#fdf2f8', border: '#fbcfe8' }, { bg: '#fffbeb', border: '#fde68a' },
            { bg: '#f5f3ff', border: '#ddd6fe' }, { bg: '#f0fdfa', border: '#a7f3d0' },
            { bg: '#fff1f2', border: '#fecdd3' }, { bg: '#ecfdf5', border: '#a7f3d0' },
            { bg: '#faf5ff', border: '#e9d5ff' }, { bg: '#fff7ed', border: '#fed7aa' }
        ];
        let colorIndex = 0;
        function getNextColor() { return courseColors[(colorIndex++) % courseColors.length]; }

        let coursePool = {};
        let scheduleA = Array.from({length: 10}, () => Array(8).fill(null));
        let scheduleB = Array.from({length: 10}, () => Array(8).fill(null));
        
        const days = ["星期一", "星期二", "星期三", "星期四", "星期五", "星期一", "星期二", "星期三", "星期四", "星期五"];
        let currentlyEditingCourseId = null;
        let courseToDeleteId = null; 
        let instanceCounter = 0; 
        let currentViewClass = 'A';
        let activeInstanceEditCell = { classId: null, day: null, period: null };
        let highlightMode = null;   
        let highlightTarget = null; 

        function renderTable(classId, weekIndex) {
            const container = document.getElementById(`table-${classId.toLowerCase()}-w${weekIndex + 1}-container`);
            if (!container) return; 
            
            let html = `<table class="border-collapse bg-white w-full h-full"><thead><tr><th class="sticky top-0 left-0 z-30 bg-gray-200 border border-gray-300 p-1 w-12 text-[11px] text-gray-700 sticky-col-shadow sticky-row-shadow">節數</th>`;
            for (let d = weekIndex * 5; d < weekIndex * 5 + 5; d++) {
                const bgClass = classId === 'A' ? "bg-blue-50" : "bg-green-50";
                html += `
                    <th class="sticky top-0 z-20 ${bgClass} border border-gray-300 p-1 min-w-[100px] text-xs text-gray-700 sticky-row-shadow font-bold">
                        <div>${days[d]}</div>
                        <div class="text-[10px] text-gray-500 font-normal schedule-date-label" data-day="${d}"></div>
                    </th>`;
            }
            html += `</tr></thead><tbody>`;

            for (let p = 0; p < 8; p++) {
                html += `<tr><td class="sticky left-0 z-10 bg-gray-100 border border-gray-300 p-1 text-center font-bold text-gray-600 text-xs sticky-col-shadow">第 ${p+1} 節</td>`;
                for (let d = weekIndex * 5; d < weekIndex * 5 + 5; d++) {
                    html += `<td id="cell-${classId}-${d}-${p}" class="border border-gray-300 p-1 relative h-[72px] min-w-[100px] align-top bg-white droppable transition-colors" data-class="${classId}" data-day="${d}" data-period="${p}" ondragover="allowDrop(event)" ondrop="dropToCell(event, '${classId}', ${d}, ${p})" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)"></td>`;
                }
                html += `</tr>`;
            }
            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        function switchView(view) {
            currentViewClass = view;
            highlightMode = null; highlightTarget = null; 
            
            const viewA = document.getElementById('view-a');
            const viewB = document.getElementById('view-b');
            const btnA = document.getElementById('btn-view-a');
            const btnB = document.getElementById('btn-view-b');
            const poolTitle = document.getElementById('pool-title');

            if (view === 'A') {
                viewA.classList.remove('hidden'); viewA.classList.add('flex');
                viewB.classList.add('hidden'); viewB.classList.remove('flex');
                btnA.className = "px-8 py-1 bg-blue-600 text-white font-bold rounded-md shadow-sm text-sm tracking-widest";
                btnB.className = "px-8 py-1 text-gray-600 font-bold rounded-md hover:bg-gray-300 text-sm tracking-widest";
                poolTitle.innerText = "📚 甲班課程庫 (待排)";
            } else {
                viewB.classList.remove('hidden'); viewB.classList.add('flex');
                viewA.classList.add('hidden'); viewA.classList.remove('flex');
                btnB.className = "px-8 py-1 bg-green-600 text-white font-bold rounded-md shadow-sm text-sm tracking-widest";
                btnA.className = "px-8 py-1 text-gray-600 font-bold rounded-md hover:bg-gray-300 text-sm tracking-widest";
                poolTitle.innerText = "📚 乙班課程庫 (待排)";
            }
            renderPool();
        }

        // ==========================================
        // 🧑‍🏫 5. 師資解析與高亮/反白邏輯
        // ==========================================
        function isTeacherMissing(course) { return !course.mainTeacher || course.mainTeacher === '未指定' || course.mainTeacher.trim() === ''; }

        function getTeachersListForCourseId(courseId) {
            if (!courseId || !coursePool[courseId]) return [];
            const c = coursePool[courseId];
            let list = [c.mainTeacher];
            if (c.tas) list = list.concat(c.tas.split(/[,、\s]+/).map(t=>t.trim()));
            return list.filter(t => t && t !== "未指定");
        }

        function getTeachersListForInstance(instanceData) {
            if (!instanceData) return [];
            let list = [instanceData.mainTeacher];
            if (instanceData.tas) list = list.concat(instanceData.tas.split(/[,、\s]+/).map(t=>t.trim()));
            return list.filter(t => t && t !== "未指定");
        }

        function createTeacherSpans(mainTeacher, tas) {
            const missing = !mainTeacher || mainTeacher === '未指定' || mainTeacher.trim() === '';
            const teacherClass = missing ? 'text-red-600 font-bold' : 'text-blue-700 font-medium';
            const mainTeacherSpan = `<span class="cursor-pointer hover:underline text-blue-700 relative z-10 pointer-events-auto" onclick="toggleHighlight('teacher', '${mainTeacher}', event)">主:${mainTeacher}</span>`;
            let tasHtml = '';
            if (tas) {
                const taLinks = tas.split(/[,、\s]+/).filter(t=>t).map(ta => `<span class="cursor-pointer hover:underline text-green-700 relative z-10 pointer-events-auto" onclick="toggleHighlight('teacher', '${ta}', event)">${ta}</span>`).join(', ');
                tasHtml = `<div class="truncate mt-0.5 text-[10.5px]">助: ${taLinks}</div>`;
            }
            return { mainTeacherSpan, tasHtml };
        }

        function toggleHighlight(mode, target, ev) {
            if(ev) ev.stopPropagation();
            if (!target || target === '未指定') return;
            if (highlightMode === mode && highlightTarget === target) {
                highlightMode = null; highlightTarget = null;
            } else {
                highlightMode = mode; highlightTarget = target;
            }
            applyHighlights();
            renderPool();
        }

        function clearHighlightOnBackground(ev) {
            if (ev.target.tagName === 'BODY' || ev.target.classList.contains('droppable')) {
                highlightMode = null; highlightTarget = null;
                applyHighlights(); renderPool();
            }
        }

        function applyHighlights() {
            document.querySelectorAll('.highlighted-instance').forEach(el => el.classList.remove('highlighted-instance'));
            if (!highlightMode) return;

            const scanHighlight = (sched, classId) => {
                for(let d=0; d<10; d++) {
                    for(let p=0; p<8; p++) {
                        const inst = sched[d][p];
                        if(!inst) continue;
                        let hit = false;
                        if (highlightMode === 'course' && inst.courseId === highlightTarget) hit = true;
                        if (highlightMode === 'teacher' && getTeachersListForInstance(inst).includes(highlightTarget)) hit = true;
                        
                        if (hit) {
                            const card = document.getElementById(`cell-${classId}-${d}-${p}`)?.firstElementChild;
                            if (card) card.classList.add('highlighted-instance');
                        }
                    }
                }
            };
            scanHighlight(scheduleA, 'A'); scanHighlight(scheduleB, 'B');
        }

        // ==========================================
        // ⚡ 6. 衝堂偵測機制
        // ==========================================
        function getConflictingTeachers(instA, instB) {
            if (!instA || !instB) return [];
            const tA = getTeachersListForInstance(instA);
            const tBList = instB.courseId ? getTeachersListForInstance(instB) : getTeachersListForCourseId(instB);
            return tA.filter(t => tBList.includes(t));
        }

        function checkAllConflicts() {
            document.querySelectorAll('.conflict').forEach(el => {
                el.classList.remove('conflict');
                const icon = el.querySelector('.conflict-icon');
                if(icon) icon.remove();
            });

            for (let d = 0; d < 10; d++) {
                for (let p = 0; p < 8; p++) {
                    const instA = scheduleA[d][p];
                    const instB = scheduleB[d][p];
                    
                    if (instA && instB) {
                        const conflicts = getConflictingTeachers(instA, instB);
                        if (conflicts.length > 0) {
                            markConflict('A', d, p, conflicts);
                            markConflict('B', d, p, conflicts);
                        }
                    }
                }
            }
        }

        function markConflict(classId, day, period, conflictingTeachers) {
            const cell = document.getElementById(`cell-${classId}-${day}-${period}`);
            if (cell) {
                cell.classList.add('conflict');
                if (!cell.querySelector('.conflict-icon')) {
                    const icon = document.createElement('div');
                    icon.className = 'conflict-icon absolute -top-2 -right-2 bg-red-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs font-bold shadow-lg animate-bounce z-20 border border-white';
                    icon.title = `⚠️ 師資衝堂警告！「${conflictingTeachers.join('、')}」在此時段同時指派於甲乙兩班！`;
                    icon.innerHTML = '!';
                    cell.appendChild(icon);
                }
            }
        }

        // ==========================================
        // 🔄 7. 拖曳控制邏輯 (管理員限定)
        // ==========================================
        function dragStart(ev, type, id) {
            if (!isAdmin) return;
            const payload = { type: type };
            if (type === 'pool') {
                payload.courseId = id;
            } else {
                payload.instanceId = id;
                payload.courseId = document.getElementById(id).dataset.courseId;
                payload.sourceCellId = document.getElementById(id).parentElement.id;
            }
            ev.dataTransfer.setData("text/plain", JSON.stringify(payload));
            ev.target.style.opacity = "0.5";
            setTimeout(() => { ev.target.style.opacity = ""; }, 0);
        }

        function allowDrop(ev) { if (isAdmin) ev.preventDefault(); }
        function dragEnter(ev) { if (!isAdmin) return; ev.preventDefault(); let t = ev.target; while (t && !t.classList.contains('droppable')) t = t.parentElement; if (t) t.classList.add('drag-over'); }
        function dragLeave(ev) { if (!isAdmin) return; let t = ev.target; while (t && !t.classList.contains('droppable')) t = t.parentElement; if (t) t.classList.remove('drag-over'); }

        function dropToPool(ev) {
            if (!isAdmin) return;
            ev.preventDefault(); clearDragOver();
            try {
                const data = JSON.parse(ev.dataTransfer.getData("text/plain"));
                if (data.type === 'instance') {
                    returnCardToPool(document.getElementById(data.instanceId), data.sourceCellId);
                }
            } catch(e) { console.error(e); }
        }

        function dropToCell(ev, targetClass, day, period) {
            if (!isAdmin) return;
            ev.preventDefault(); clearDragOver();
            try {
                const data = JSON.parse(ev.dataTransfer.getData("text/plain"));
                const targetCell = document.getElementById(`cell-${targetClass}-${day}-${period}`);
                const dropCourseId = data.courseId;
                
                if (data.type === 'pool') {
                    if (coursePool[dropCourseId].remaining <= 0) return;
                    if (targetCell.children.length > 0) returnCardToPool(targetCell.children[0], targetCell.id);
                    
                    coursePool[dropCourseId].remaining--;
                    renderPool();
                    
                    const newInst = { courseId: dropCourseId, mainTeacher: coursePool[dropCourseId].mainTeacher, tas: coursePool[dropCourseId].tas };
                    targetCell.appendChild(createInstanceCard(newInst));
                    updateStateArray(targetClass, day, period, newInst);
                    
                } else if (data.type === 'instance') {
                    const instEl = document.getElementById(data.instanceId);
                    if (!instEl || targetCell.id === data.sourceCellId) return;
                    
                    const sParts = data.sourceCellId.split('-');
                    const sClass = sParts[1], sDay = parseInt(sParts[2]), sPeriod = parseInt(sParts[3]);
                    const movingData = (sClass === 'A' ? scheduleA : scheduleB)[sDay][sPeriod];
                    
                    clearSourceDataRecord(data.sourceCellId);
                    if (targetCell.children.length > 0) returnCardToPool(targetCell.children[0], targetCell.id);
                    
                    targetCell.appendChild(instEl);
                    updateStateArray(targetClass, day, period, movingData);
                }
                checkAllConflicts();
                applyHighlights();
            } catch(e) { console.error(e); }
        }

        function returnCardToPool(instEl, cellId) {
            if(!instEl) return;
            const courseId = instEl.dataset.courseId;
            if (coursePool[courseId]) {
                coursePool[courseId].remaining++;
            }
            instEl.remove();
            clearSourceDataRecord(cellId);
            renderPool();
            checkAllConflicts();
        }
        function clearDragOver() { document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over')); }
        function clearSourceDataRecord(cellId) {
            const parts = cellId.split('-');
            const sClass = parts[1], sDay = parseInt(parts[2]), sPeriod = parseInt(parts[3]);
            if (sClass === 'A') scheduleA[sDay][sPeriod] = null;
            if (sClass === 'B') scheduleB[sDay][sPeriod] = null;
        }
        function updateStateArray(classId, day, period, data) {
            if (classId === 'A') scheduleA[day][period] = data;
            if (classId === 'B') scheduleB[day][period] = data;
        }

        // ==========================================
        // 🎨 8. 卡片與課程庫繪製渲染
        // ==========================================
        function renderPool() {
            const container = document.getElementById('pool-container');
            container.innerHTML = '';
            for (const [courseId, course] of Object.entries(coursePool)) {
                if ((course.targetClass || 'A') !== currentViewClass) continue;
                const el = document.createElement('div');
                const hasNoTeacher = isTeacherMissing(course);
                let isHighlighted = (highlightMode === 'course' && highlightTarget === courseId) || (highlightMode === 'teacher' && getTeachersListForCourseId(courseId).includes(highlightTarget));
                
                let baseClass = "rounded shadow-sm p-2 flex flex-col text-xs relative transition-all group border " + (isAdmin && course.remaining > 0 ? "cursor-grab " : "cursor-pointer ");
                if (hasNoTeacher) baseClass += "no-teacher-alert ";
                if (isHighlighted) baseClass += "ring-4 ring-blue-500/60 !border-blue-500 !border-solid ";

        function generatePayrollData() {
            const payroll = {}; 
            const classSelect = document.getElementById('payroll-class-select')?.value || 'A';
            const suspendedDates = getSuspendedDatesArray();

            const addRecord = (teacher, classId, dayIndex, role, unit) => {
                if (classId !== classSelect) return; 
                if (!teacher || teacher === '未指定' || teacher.trim() === '') return;
                
                // ✨ 升級邏輯：如果這天在停課名單中，直接跳過不計算！
                const dateStr = getScheduleDate(dayIndex);
                if (suspendedDates.includes(dateStr)) return;

                teacher = teacher.trim();
                if (!payroll[teacher]) {
                    payroll[teacher] = {
                        main: { periods: 0, days: new Set(), units: new Set() },
                        ta: { periods: 0, days: new Set(), units: new Set() }
                    };
                }
                
                if (role === '主教') {
                    payroll[teacher].main.periods++;
                    payroll[teacher].main.days.add(dayIndex); 
                    payroll[teacher].main.units.add(unit);
                } else {
                    payroll[teacher].ta.periods++;
                    payroll[teacher].ta.days.add(dayIndex);
                    payroll[teacher].ta.units.add(unit);
                }
            };

            const scan = (sched, classId) => {
                for (let d = 0; d < 10; d++) {
                    for (let p = 0; p < 8; p++) {
                        const inst = sched[d][p];
                        if (inst && coursePool[inst.courseId]) {
                            const unit = coursePool[inst.courseId].unit;
                            if (inst.mainTeacher) addRecord(inst.mainTeacher, classId, d, '主教', unit);
                            if (inst.tas) {
                                const tasList = inst.tas.split(/[,、\s]+/).filter(t => t.trim());
                                tasList.forEach(ta => addRecord(ta, classId, d, '助教', unit));
                            }
                        }
                    }
                }
            };

            if (classSelect === 'A') scan(scheduleA, 'A');
            if (classSelect === 'B') scan(scheduleB, 'B');

            return payroll;
        }

        // ==========================================
        // 📤 一鍵匯出資料至 Google Sheets (對接 GAS)
        // ==========================================
        function exportToGoogleSheets() {
            const gasUrl = document.getElementById('payroll-gas-url').value.trim();
            if (!gasUrl) {
                showToast("⚠️ 請先在黃色欄位中填寫您的 Google Apps Script 網址！", "warning");
                return;
            }

            const payrollData = generatePayrollData();
            const teacher = document.getElementById('payroll-teacher-select').value;
            if (!teacher || !payrollData[teacher]) {
                showToast("⚠️ 找不到該老師的授課資料！", "error");
                return;
            }

            const data = payrollData[teacher];
            const projectName = document.getElementById('payroll-project-name').value;
            const classNote = document.getElementById('payroll-class-note').value;
            const rYear = document.getElementById('payroll-year').value;
            const mainRate = parseInt(document.getElementById('payroll-main-rate').value) || 400;
            const taRate = parseInt(document.getElementById('payroll-ta-rate').value) || 200;
            const abstract = document.getElementById('payroll-abstract').value;
            const isInternal = document.getElementById('payroll-is-internal').checked;
            const isUnion = document.getElementById('payroll-is-union').checked;
            const startDate = document.getElementById('schedule-start-date').value;
            const suspendedDates = getSuspendedDatesArray();

            let activeDaysList = [];
            let unitNamesList = [];
            
            // 掃描課程，並自動過濾掉停課日
            const scanClass = (sched, classId) => {
                for (let d = 0; d < 10; d++) {
                    const dateStr = getScheduleDate(d);
                    if (suspendedDates.includes(dateStr)) continue; // ☔ 停課日攔截！

                    for (let p = 0; p < 8; p++) {
                        const inst = sched[d][p];
                        if (inst && coursePool[inst.courseId]) {
                            const isMain = inst.mainTeacher === teacher;
                            const isTa = inst.tas && inst.tas.split(/[,、\s]+/).map(t=>t.trim()).includes(teacher);
                            if (isMain || isTa) {
                                activeDaysList.push(d);
                                unitNamesList.push(coursePool[inst.courseId].unit);
                            }
                        }
                    }
                }
            };
            scanClass(scheduleA, 'A');
            scanClass(scheduleB, 'B');

            const uniqueDays = Array.from(new Set(activeDaysList));
            const uniqueUnits = Array.from(new Set(unitNamesList));

            let dateStrList = [];
            if (data.main.periods > 0) {
                dateStrList.push(formatDatesChinese(data.main.days) + "(主教)");
            }
            if (data.ta.periods > 0) {
                dateStrList.push(formatDatesChinese(data.ta.days) + "(助教)");
            }
            const dateTimeStr = rYear + "年" + dateStrList.join("；") + "，每日4堂課。";

            const payload = {
                teacherName: teacher,
                projectName: projectName,
                classNote: classNote,
                year: rYear,
                mainPeriods: data.main.periods,
                mainRate: mainRate,
                taPeriods: data.ta.periods,
                taRate: taRate,
                abstract: abstract,
                isInternal: isInternal,
                isUnion: isUnion,
                startDate: startDate,
                dateTimeStr: dateTimeStr,
                activeDays: uniqueDays,
                unitNames: uniqueUnits
            };

            const btn = document.getElementById('btn-export-gas');
            btn.innerText = "⏳ 正在同步發送中...";
            btn.disabled = true;

            fetch(gasUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(() => {
                btn.innerText = "📤 匯出此人簽呈至 Google Sheets";
                btn.disabled = false;
                showToast("🎉 匯出指令已送出！請至 Google Sheets 檢查分頁！", "success");
            })
            .catch(err => {
                btn.innerText = "📤 匯出此人簽呈至 Google Sheets";
                btn.disabled = false;
                console.error(err);
                alert("❌ 連線至 Google API 失敗，請確認網址是否正確。");
            });
        }

        // ==========================================
        // 💾 11. 【安全升級】雲端資料庫編碼與儲存核心
        // ==========================================
        function serializeState() { 
            return { 
                pool: JSON.parse(JSON.stringify(coursePool)), 
                schedA: JSON.parse(JSON.stringify(scheduleA)), 
                schedB: JSON.parse(JSON.stringify(scheduleB)),
                teacherMetadata: JSON.parse(JSON.stringify(teacherMetadata)), 
                startDate: document.getElementById('schedule-start-date')?.value || "2025-07-07",
                googleGasUrl: document.getElementById('payroll-gas-url')?.value || "",
                suspendedDates: document.getElementById('suspend-dates-input')?.value || ""
            }; 
        }
        
        function deserializeState(state) {
            if (!document.getElementById('cell-A-0-0')) {
                renderTable('A', 0); renderTable('A', 1);
                renderTable('B', 0); renderTable('B', 1);
            }

            document.querySelectorAll('td.droppable').forEach(td => td.innerHTML = '');
            for(let d=0;d<10;d++)for(let p=0;p<8;p++){ scheduleA[d][p]=null; scheduleB[d][p]=null; }
            coursePool = state.pool || {};
            teacherMetadata = state.teacherMetadata || {}; 
            
            if (state.startDate) {
                const dateInput = document.getElementById('schedule-start-date');
                if (dateInput) dateInput.value = state.startDate;
            }
            if (state.googleGasUrl) {
                const gasInput = document.getElementById('payroll-gas-url');
                if (gasInput) gasInput.value = state.googleGasUrl;
            }
            if (state.suspendedDates) {
                const suspendInput = document.getElementById('suspend-dates-input');
                if (suspendInput) suspendInput.value = state.suspendedDates;
            }
            updateScheduleDates(); 

            Object.values(coursePool).forEach(c => { if(!c.color) c.color = getNextColor(); });

            const loadSched = (src, dest, classId) => {
                if(!src) return;
                for(let d=0; d<10; d++) {
                    if(!src[d]) continue;
                    for(let p=0; p<8; p++) {
                        let item = src[d][p]; if(!item) continue;
                        if(typeof item === 'string') {
                            if(coursePool[item]) item = { courseId: item, mainTeacher: coursePool[item].mainTeacher, tas: coursePool[item].tas };
                            else continue;
                        }
                        if(coursePool[item.courseId]) {
                            dest[d][p] = item;
                            const cell = document.getElementById(`cell-${classId}-${d}-${p}`);
                            if(cell) cell.appendChild(createInstanceCard(item));
                        }
                    }
                }
            };
            loadSched(state.schedA, scheduleA, 'A');
            loadSched(state.schedB, scheduleB, 'B');
            
            renderPool();
            checkAllConflicts();
            applyHighlights();
        }

        function saveToCloud() {
            if(!isAdmin) return;
            const rawState = serializeState();
            
            if(db) {
                showToast("📡 正在即時儲存至雲端...", "info");
                const securePayload = {
                    encodedData: JSON.stringify(rawState),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                };

                db.collection("schedules").doc("master_data_v2").set(securePayload)
                .then(() => showToast("☁️ 資料已成功同步至 Google 雲端儲存中心！", "success"))
                .catch(e => { 
                    console.error("雲端存檔錯誤: ", e); 
                    showToast("❌ 雲端儲存失敗", "error"); 
                });
            } else {
                localStorage.setItem('pro_schedule_state', JSON.stringify(rawState));
                showToast("💾 資料已暫存至您電腦的本機空間！(未配置 Firebase 金鑰)", "success");
            }
        }

        function loadFromCloud() {
            if(db) {
                db.collection("schedules").doc("master_data_v2").get()
                .then(doc => {
                    if(doc.exists && doc.data().encodedData) {
                        const decodedState = JSON.parse(doc.data().encodedData);
                        deserializeState(decodedState);
                        
                        document.getElementById('role-badge').innerText = isAdmin ? "✍️ 管理員模式" : "👁️ 唯讀展示模式";
                        showToast("☁️ 已成功同步最新雲端資料", "success");
                    } else {
                        db.collection("schedules").doc("master_data").get()
                        .then(oldDoc => {
                            if(oldDoc.exists) {
                                deserializeState(oldDoc.data());
                                document.getElementById('role-badge').innerText = isAdmin ? "✍️ 管理員模式" : "👁️ 唯讀展示模式";
                                showToast("☁️ 成功載入舊版雲端備份", "success");
                            }
                        })
                        .catch(() => {});
                    }
                })
                .catch(e => { 
                    document.getElementById('role-badge').innerText = isAdmin ? "✍️ 管理員模式 (離線)" : "👁️ 唯讀模式 (離線)";
                });
            }
        }

        function loadFromLocal(isSilent = false) {
            try {
                const data = localStorage.getItem('pro_schedule_state');
                if(data) { 
                    deserializeState(JSON.parse(data)); 
                    if(!isSilent) showToast("📂 載入本機備份成功", "info"); 
                }
            } catch(e) { console.error(e); }
        }

        function showToast(msg, type='info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            let bg = 'bg-blue-600';
            if(type==='success') bg = 'bg-green-600';
            if(type==='error') bg = 'bg-red-600';
            if(type==='warning') bg = 'bg-yellow-500';
            toast.className = `${bg} text-white px-4 py-2 rounded shadow-lg text-sm font-bold opacity-0 transition-opacity pointer-events-auto`;
            toast.innerText = msg; container.appendChild(toast);
            setTimeout(()=>toast.classList.remove('opacity-0'), 10);
            setTimeout(()=>{ toast.classList.add('opacity-0'); setTimeout(()=>toast.remove(), 300); }, 3000);
        }

        // ==========================================
        // 🚀 12. 系統啟動
        // ==========================================
        renderTable('A', 0);
        renderTable('A', 1);
        renderTable('B', 0);
        renderTable('B', 1);
        
        loadFromLocal(true);
        checkPermissionsAndInitFirebase();

    </script>
</body>
</html>
