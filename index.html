<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式拖曳排課系統 (專業版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
        .no-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .no-scrollbar::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        .no-scrollbar::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        .read-only-mode .cursor-grab { cursor: default !important; }
        .droppable.drag-over { background-color: #e0f2fe !important; border: 2px dashed #0284c7 !important; }
        @keyframes pulse-red { 0%, 100% { background-color: #fee2e2; } 50% { background-color: #fca5a5; } }
        .conflict { animation: pulse-red 2s infinite; border: 2px solid #ef4444 !important; }
        .sticky-col-shadow { box-shadow: 2px 0 5px -2px rgba(0,0,0,0.1); }
        .sticky-row-shadow { box-shadow: 0 2px 5px -2px rgba(0,0,0,0.1); }
        .gs-header-gray { background-color: #f8f9fa; color: #5f6368; font-weight: bold; }
        .gs-cell-border { border: 1px solid #cbd5e1 !important; }

        @media print {
            body, main { height: auto !important; overflow: visible !important; background-color: white !important; }
            #view-a, #view-b { flex-direction: column !important; height: auto !important; overflow: visible !important; gap: 20px !important; }
            section { overflow: visible !important; border: 1px solid #cbd5e1 !important; box-shadow: none !important; page-break-inside: avoid; }
            .overflow-auto { overflow: visible !important; }
            .sticky { position: static !important; box-shadow: none !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .group-hover\:opacity-100 { display: none !important; }

            body:not(.print-mode-teacher):not(.print-mode-payroll):not(.print-mode-single-payroll):not(.print-mode-signin):not(.print-mode-student) #print-only-container { display: none !important; }
            body.print-mode-teacher > *:not(#print-only-container) { display: none !important; }
            body.print-mode-teacher #print-only-container { display: block !important; width: 100%; }
            body.print-mode-teacher .print-page-break { page-break-before: always; }
            body.print-mode-payroll > *:not(#print-payroll-container) { display: none !important; }
            body.print-mode-payroll #print-payroll-container { display: block !important; width: 100%; }
            body.print-mode-single-payroll > *:not(#print-single-payroll-container) { display: none !important; }
            body.print-mode-single-payroll #print-single-payroll-container { display: block !important; width: 100%; }
            body.print-mode-signin > *:not(#print-signin-container) { display: none !important; }
            body.print-mode-signin #print-signin-container { display: block !important; width: 100%; }
            body.print-mode-student > *:not(#print-student-container) { display: none !important; }
            body.print-mode-student #print-student-container { display: block !important; width: 100% !important; max-width: 100% !important; }
        }

        @keyframes instance-glow { 0%, 100% { box-shadow: 0 0 4px #3b82f6, inset 0 0 4px rgba(59, 130, 246, 0.3); } 50% { box-shadow: 0 0 16px #3b82f6, inset 0 0 8px rgba(59, 130, 246, 0.5); } }
        .highlighted-instance { animation: instance-glow 2s infinite; border: 2px solid #2563eb !important; transform: scale(1.02); z-index: 30 !important; }
        .no-teacher-alert { border: 2px dashed #ef4444 !important; background-color: #fef2f2 !important; }
    </style>
</head>
<body class="bg-gray-100 h-screen w-screen overflow-hidden flex flex-col font-sans text-gray-800" onclick="clearHighlightOnBackground(event)">

    <!-- 列印專用隱藏容器群 -->
    <div id="print-only-container" class="hidden"></div>
    <div id="print-payroll-container" class="hidden"></div>
    <div id="print-single-payroll-container" class="hidden"></div>
    <div id="print-signin-container" class="hidden"></div>
    <div id="print-student-container" class="hidden"></div>

    <header class="flex justify-between items-center bg-white px-4 py-2 shadow-sm border-b border-gray-200 shrink-0 z-40 print:hidden">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                📅 互動式拖曳排課系統 
                <span class="bg-blue-100 text-blue-800 text-xs px-2 py-0.5 rounded-full font-normal">專業版</span>
            </h1>
            <span id="role-badge" onclick="toggleAdminMode()" class="cursor-pointer bg-amber-100 text-amber-800 text-xs px-2 py-0.5 rounded font-bold hover:opacity-80 transition-opacity shadow-sm" title="點擊切換管理權限">📡 系統啟動中...</span>
            
            <div class="admin-btn hidden flex items-center gap-1.5 text-xs bg-gray-50 border border-gray-200 p-1.5 rounded shadow-inner">
                <span class="text-gray-600 font-bold">📅 第一週(一) 起始日期:</span>
                <input type="date" id="schedule-start-date" class="border border-gray-300 rounded p-0.5 focus:outline-none focus:ring-1 focus:ring-indigo-500" value="2025-07-07" onchange="updateScheduleDates(); saveToCloud(true);">
            </div>

            <div class="admin-btn hidden flex items-center gap-1.5 text-xs bg-red-50 border border-red-200 p-1.5 rounded shadow-inner" title="在此輸入停課日期，結算時將自動扣除鐘點費。例如: 7/8, 7/15">
                <span class="text-red-700 font-bold">☔ 停課日扣除 (不計薪):</span>
                <input type="text" id="suspend-dates-input" class="border border-red-300 rounded p-0.5 focus:outline-none focus:ring-1 focus:ring-red-500 text-center w-[120px]" placeholder="如: 7/8, 7/15" onchange="updatePayrollUI(); saveToCloud(true);">
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="openTeacherSigninModal()" class="px-3 py-1.5 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 rounded transition text-sm font-medium border border-emerald-200 shadow-sm">📝 教師簽到表</button>
            <button onclick="openStudentAttendanceModal()" class="px-3 py-1.5 bg-sky-50 text-sky-700 hover:bg-sky-100 rounded transition text-sm font-medium border border-sky-200 shadow-sm">👥 學生點名表</button>
            <button onclick="openPurchaseModal()" class="admin-btn hidden px-3 py-1.5 bg-orange-50 text-orange-700 hover:bg-orange-100 rounded transition text-sm font-medium border border-orange-200">🛒 物品財務請購</button>
            <button onclick="openPayrollModal()" class="admin-btn hidden px-3 py-1.5 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 rounded transition text-sm font-medium border border-indigo-200">💰 印領清冊</button>
            <button onclick="saveToCloud()" class="admin-btn hidden px-3 py-1.5 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded transition text-sm font-medium border border-blue-200">💾 儲存進度至雲端</button>
            <button onclick="loadFromCloud()" class="admin-btn hidden px-3 py-1.5 bg-purple-50 text-purple-600 hover:bg-purple-100 rounded transition text-sm font-medium border border-purple-200">📂 強制重新載入</button>
            <button onclick="setPrintPageSize('landscape'); window.print()" class="px-3 py-1.5 bg-gray-50 text-gray-700 hover:bg-gray-200 rounded transition text-sm font-medium border border-gray-300 ml-2">🖨️ 列印班級</button>
        </div>
    </header>

    <main class="flex-1 flex flex-row overflow-hidden p-2 gap-2 print:p-0 print:m-0">
        <div class="w-[80%] flex flex-col min-w-0 flex-shrink-0 print:w-full print:block">
            <div class="flex justify-center mb-2 shrink-0 print:hidden">
                <div class="inline-flex bg-gray-200 rounded-lg p-1 shadow-inner">
                    <button id="btn-view-a" onclick="switchView('A')" class="px-8 py-1 bg-blue-600 text-white font-bold rounded-md shadow-sm transition-all text-sm tracking-widest">甲班課表</button>
                    <button id="btn-view-b" onclick="switchView('B')" class="px-8 py-1 text-gray-600 font-bold rounded-md hover:bg-gray-300 transition-all text-sm tracking-widest">乙班課表</button>
                </div>
            </div>

            <div id="view-a" class="flex-1 flex flex-row gap-2 overflow-hidden">
                <section class="flex-1 flex flex-col bg-white border border-gray-300 rounded shadow-sm overflow-hidden min-w-[300px]">
                    <div class="bg-blue-600 text-white py-1.5 font-bold text-center text-sm tracking-widest shrink-0">甲班 - 第一週</div>
                    <div class="flex-1 overflow-auto relative no-scrollbar bg-gray-50" id="table-a-w1-container"></div>
                </section>
                <section class="flex-1 flex flex-col bg-white border border-gray-300 rounded shadow-sm overflow-hidden min-w-[300px]">
                    <div class="bg-blue-600 text-white py-1.5 font-bold text-center text-sm tracking-widest shrink-0">甲班 - 第二週</div>
                    <div class="flex-1 overflow-auto relative no-scrollbar bg-gray-50" id="table-a-w2-container"></div>
                </section>
            </div>

            <div id="view-b" class="hidden flex-1 flex flex-row gap-2 overflow-hidden">
                <section class="flex-1 flex flex-col bg-white border border-gray-300 rounded shadow-sm overflow-hidden min-w-[300px]">
                    <div class="bg-green-600 text-white py-1.5 font-bold text-center text-sm tracking-widest shrink-0">乙班 - 第一週</div>
                    <div class="flex-1 overflow-auto relative no-scrollbar bg-gray-50" id="table-b-w1-container"></div>
                </section>
                <section class="flex-1 flex flex-col bg-white border border-gray-300 rounded shadow-sm overflow-hidden min-w-[300px]">
                    <div class="bg-green-600 text-white py-1.5 font-bold text-center text-sm tracking-widest shrink-0">乙班 - 第二週</div>
                    <div class="flex-1 overflow-auto relative no-scrollbar bg-gray-50" id="table-b-w2-container"></div>
                </section>
            </div>
        </div>

        <aside id="sidebar-container" class="w-[20%] bg-white border border-gray-300 rounded shadow-sm flex flex-col shrink-0 min-w-[200px] print:hidden">
            <div class="bg-gray-700 text-white py-1.5 font-bold text-center text-sm flex justify-between items-center px-3 shrink-0">
                <span id="pool-title">📚 甲班課程庫 (待排)</span>
            </div>
            <div id="pool-container" class="flex-1 overflow-y-auto p-2 space-y-2 bg-gray-50 droppable pb-20"
                 ondragover="allowDrop(event)" ondrop="dropToPool(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)">
            </div>
        </aside>
    </main>

    <!-- 🛒 物品財務請購 Modal -->
    <div id="purchase-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-[70] print:hidden">
        <div class="bg-white rounded-lg p-5 w-[850px] max-w-[95vw] max-h-[90vh] flex flex-col shadow-2xl overflow-y-auto">
            <div class="flex justify-between items-center mb-3 border-b pb-2 shrink-0">
                <h2 class="text-xl font-bold text-orange-800 flex items-center gap-2">🛒 物品財務請購單 產生器</h2>
                <button onclick="closePurchaseModal()" class="text-gray-500 hover:text-red-500 text-2xl font-bold leading-none">&times;</button>
            </div>
            
            <div class="bg-orange-50/70 p-4 rounded-lg border border-orange-100 grid grid-cols-4 gap-4 text-sm mb-3">
                <div class="col-span-1">
                    <label class="block font-bold text-gray-700 mb-1">年度 (民國)</label>
                    <input type="text" id="purchase-year" class="w-full border border-gray-300 rounded p-1.5" value="114">
                </div>
                <div class="col-span-2">
                    <label class="block font-bold text-gray-700 mb-1">用途別 / 工作計畫名稱</label>
                    <input type="text" id="purchase-project-name" class="w-full border border-gray-300 rounded p-1.5" value="114年夏日樂學計畫方案">
                </div>
                <div class="col-span-1">
                    <label class="block font-bold text-gray-700 mb-1">班別</label>
                    <select id="purchase-class-select" class="w-full border border-gray-300 rounded p-1.5 font-bold text-gray-700">
                        <option value="甲班">甲班</option>
                        <option value="乙班">乙班</option>
                        <option value="全校">全校</option>
                    </select>
                </div>
                <div class="col-span-2">
                    <label class="block font-bold text-gray-700 mb-1">用途摘要</label>
                    <input type="text" id="purchase-abstract" class="w-full border border-gray-300 rounded p-1.5" value="夏日樂學材料費">
                </div>
                <div class="col-span-2">
                    <label class="block font-bold text-gray-700 mb-1">代墊人姓名 (可不填)</label>
                    <input type="text" id="purchase-payer-name" class="w-full border border-gray-300 rounded p-1.5" placeholder="例如: 王小明">
                </div>
                
                <div class="col-span-4 bg-white p-3 rounded border border-orange-200 mt-2 shadow-inner">
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="font-bold text-orange-900">請購項目明細</h3>
                        <button onclick="addPurchaseItem()" class="bg-orange-600 text-white px-3 py-1.5 rounded text-xs font-bold hover:bg-orange-700">➕ 新增一列</button>
                    </div>
                    <div class="grid grid-cols-12 gap-1 mb-1 font-bold text-gray-600 text-center text-xs bg-gray-100 p-1 rounded">
                        <div class="col-span-1">項次</div>
                        <div class="col-span-3">品名</div>
                        <div class="col-span-1">單位</div>
                        <div class="col-span-2">數量</div>
                        <div class="col-span-2">單價</div>
                        <div class="col-span-2">金額</div>
                        <div class="col-span-1">刪除</div>
                    </div>
                    <div id="purchase-items-container" class="space-y-1 max-h-[30vh] overflow-y-auto pr-1">
                        <!-- 動態明細區 -->
                    </div>
                    <div class="text-right font-bold text-xl text-red-600 mt-3 pt-2 border-t">
                        總計金額：$<span id="purchase-total-amount">0</span>
                    </div>
                </div>
            </div>
            
            <div class="flex justify-between items-center mt-2">
                <div class="text-xs text-gray-500 font-bold bg-gray-100 p-2 rounded">💡 系統會自動讀取您在「印領清冊」設定的 GAS 網址與對應版面。</div>
                <div class="flex gap-3 shrink-0">
                    <button onclick="closePurchaseModal()" class="px-5 py-2 bg-gray-200 text-gray-700 rounded font-bold hover:bg-gray-300 transition-colors">取消</button>
                    <button id="btn-export-purchase" onclick="exportPurchaseToGAS()" class="px-6 py-2 bg-orange-600 text-white rounded font-bold hover:bg-orange-700 shadow-sm flex items-center gap-2 transition-all">
                        📤 匯出請購單至 Google Sheets
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 💰 鐘點費印領清冊 Modal -->
    <div id="payroll-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-[70] print:hidden">
        <div class="bg-white rounded-lg p-5 w-[980px] max-w-[98vw] h-[90vh] max-h-[95vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="flex justify-between items-center mb-2 border-b pb-2 shrink-0">
                <h2 class="text-xl font-bold text-indigo-800 flex items-center gap-2">💰 鐘點費印領清冊與憑證黏存單產生器</h2>
                <button onclick="closePayrollModal()" class="text-gray-500 hover:text-red-500 text-2xl font-bold leading-none">&times;</button>
            </div>
            
            <div class="flex border-b border-gray-200 mb-2 shrink-0 text-sm">
                <button id="tab-payroll-single" onclick="switchPayrollTab('single')" class="py-2 px-6 font-bold border-b-2 border-indigo-600 text-indigo-700">📄 1人單面含支出憑證黏存單</button>
                <button id="tab-payroll-summary" onclick="switchPayrollTab('summary')" class="py-2 px-6 font-bold border-b-2 border-transparent text-gray-500 hover:text-indigo-600">📊 全員彙整統計總清單</button>
            </div>

            <!-- 各設定欄位 -->
            <div class="bg-indigo-50/70 p-3 rounded-lg border border-indigo-100 grid grid-cols-4 gap-3 text-xs mb-3 shrink-0">
                <div class="col-span-2">
                    <label class="block font-bold text-gray-700 mb-1">工作計畫名稱</label>
                    <input type="text" id="payroll-project-name" class="w-full border border-gray-300 rounded p-1" value="114年夏日樂學計畫方案-本土語文活動課程" oninput="updatePayrollUI()">
                </div>
                <div>
                    <label class="block font-bold text-indigo-900 mb-1">統計班別</label>
                    <select id="payroll-class-select" class="w-full border border-indigo-300 bg-indigo-50 rounded p-1 font-bold text-indigo-800" onchange="onPayrollClassChange()">
                        <option value="A">甲班</option>
                        <option value="B">乙班</option>
                    </select>
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-1">班別註記</label>
                    <input type="text" id="payroll-class-note" class="w-full border border-gray-300 rounded p-1" value="甲班" oninput="updatePayrollUI()">
                </div>
                
                <div class="col-span-4 flex flex-wrap items-center gap-1.5 bg-white/60 p-2 rounded border border-indigo-100 mt-0.5">
                    <label class="font-bold text-gray-700 mr-1 text-indigo-900">依據公文：</label>
                    <input type="text" id="payroll-doc-agency" class="border border-gray-300 rounded p-1 w-28 text-center" value="彰化縣政府" placeholder="(留白請清空)" oninput="updatePayrollUI()">
                    <input type="text" id="payroll-doc-year" class="border border-gray-300 rounded p-1 w-14 text-center" value="114" placeholder="(年)" oninput="updatePayrollUI()">
                    <span class="text-gray-600 font-bold">年</span>
                    <input type="text" id="payroll-doc-month" class="border border-gray-300 rounded p-1 w-10 text-center" value="5" placeholder="(月)" oninput="updatePayrollUI()">
                    <span class="text-gray-600 font-bold">月</span>
                    <input type="text" id="payroll-doc-day" class="border border-gray-300 rounded p-1 w-10 text-center" value="15" placeholder="(日)" oninput="updatePayrollUI()">
                    <span class="text-gray-600 font-bold">日 府</span>
                    <input type="text" id="payroll-doc-word" class="border border-gray-300 rounded p-1 w-14 text-center" value="教社" placeholder="(字)" oninput="updatePayrollUI()">
                    <span class="text-gray-600 font-bold">字第</span>
                    <input type="text" id="payroll-doc-number" class="border border-gray-300 rounded p-1 w-32 text-center" value="1140182600" placeholder="(文號)" oninput="updatePayrollUI()">
                    <span class="text-gray-600 font-bold">號函辦理</span>
                </div>

                <div>
                    <label class="block font-bold text-gray-700 mb-1">年度 (民國)</label>
                    <input type="number" id="payroll-year" class="w-full border border-gray-300 rounded p-1" value="114" oninput="updatePayrollUI()">
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-1">主教單價 (元/節)</label>
                    <input type="number" id="payroll-main-rate" class="w-full border border-gray-300 rounded p-1" value="400" oninput="updatePayrollUI()">
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-1">助教單價 (元/節)</label>
                    <input type="number" id="payroll-ta-rate" class="w-full border border-gray-300 rounded p-1" value="200" oninput="updatePayrollUI()">
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-1">用途摘要</label>
                    <input type="text" id="payroll-abstract" class="w-full border border-gray-300 rounded p-1" value="內聘講師鐘點費" oninput="updatePayrollUI()">
                </div>

                <div>
                    <label class="block font-bold text-gray-700 mb-1">選擇統計老師</label>
                    <select id="payroll-teacher-select" class="w-full border border-gray-300 rounded p-1 font-bold text-indigo-800" onchange="onPayrollTeacherChange()">
                    </select>
                </div>
                <div>
                    <label class="block font-bold text-indigo-900 mb-1">身分證字號</label>
                    <input type="text" id="payroll-teacher-id" class="w-full border border-indigo-200 bg-indigo-50/50 rounded p-1" placeholder="例如: A123456789">
                </div>
                <div class="col-span-2">
                    <label class="block font-bold text-indigo-900 mb-1">戶籍地址</label>
                    <input type="text" id="payroll-teacher-address" class="w-full border border-indigo-200 bg-indigo-50/50 rounded p-1" placeholder="彰化縣芬園鄉...">
                </div>
                
                <div class="col-span-4 bg-yellow-50 p-2 rounded border border-yellow-200">
                    <label class="block font-bold text-yellow-800 mb-1">🔗 Google Apps Script 網址 (部署 Web App 後取得的 URL)</label>
                    <input type="text" id="payroll-gas-url" class="w-full border border-yellow-300 rounded p-1 text-xs" placeholder="https://script.google.com/macros/s/.../exec">
                </div>
                
                <div class="flex items-center gap-4 col-span-4 pt-1 border-t border-indigo-100">
                    <label class="flex items-center gap-1 font-bold text-gray-700 cursor-pointer">
                        <input type="checkbox" id="payroll-is-internal" checked onchange="updatePayrollUI();">
                        講師為本機關投保人員 (內聘免扣補充保費)
                    </label>
                </div>
            </div>

            <div class="flex-1 overflow-auto bg-gray-100 p-4 rounded border border-gray-200 no-scrollbar relative">
                <div id="payroll-single-preview" class="space-y-4"></div>
                <div id="payroll-summary-preview" class="hidden"><div id="payroll-summary-container"></div></div>
            </div>
            
            <div class="flex justify-end gap-3 mt-3 pt-2 border-t shrink-0">
                <button onclick="closePayrollModal()" class="px-5 py-2 bg-gray-200 text-gray-700 rounded font-bold hover:bg-gray-300 transition-colors">關閉</button>
                <button id="btn-export-gas" onclick="exportToGoogleSheets()" class="px-6 py-2 bg-green-600 text-white rounded font-bold hover:bg-green-700 shadow-sm flex items-center gap-2 transition-all">
                    📤 匯出此人簽呈至 Google Sheets
                </button>
            </div>
        </div>
    </div>
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none print:hidden"></div>

    <script>
        let isAdmin = true;
        let scheduleA = Array.from({length: 10}, () => Array(8).fill(null));
        let scheduleB = Array.from({length: 10}, () => Array(8).fill(null));
        let teacherMetadata = {};

        // --- Firebase Cloud Integration 雲端資料庫模組 ---
        let db, auth, user, app;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-schedule-app';
        const firebaseConfigStr = typeof __firebase_config !== 'undefined' ? __firebase_config : '{}';
        const firebaseConfig = JSON.parse(firebaseConfigStr);

        async function initFirebase() {
            try {
                if (Object.keys(firebaseConfig).length === 0) {
                    console.warn("未偵測到 Firebase 配置，目前為單機模式。");
                    return;
                }
                const { initializeApp } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
                const { getAuth, signInAnonymously, signInWithCustomToken } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
                const { getFirestore } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");

                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                user = auth.currentUser;
                console.log("Firebase 初始化成功。使用者 UID:", user.uid);
                
                // 初始化完成後自動從雲端載入資料
                await loadFromCloud();
            } catch (e) {
                console.error("Firebase init error:", e);
                showToast("⚠️ 雲端資料庫初始化失敗，目前為單機模式", "error");
            }
        }

        window.saveToCloud = async function(silent = false) {
            if (!user || !db) {
                if (!silent) showToast("⚠️ 未連接雲端，僅單機保存", "warning");
                return;
            }
            try {
                const { doc, setDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                // 依據規定使用正確的安全路徑 (public/data)
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'scheduleData');
                
                const dataToSave = {
                    scheduleA: JSON.stringify(scheduleA),
                    scheduleB: JSON.stringify(scheduleB),
                    teacherMetadata: JSON.stringify(teacherMetadata),
                    startDate: document.getElementById('schedule-start-date').value,
                    suspendDates: document.getElementById('suspend-dates-input').value,
                    gasUrl: document.getElementById('payroll-gas-url') ? document.getElementById('payroll-gas-url').value : '',
                    timestamp: new Date().toISOString()
                };
                
                if (!silent) {
                    const btn = document.querySelector('button[onclick="saveToCloud()"]');
                    if(btn) btn.innerText = "⏳ 儲存中...";
                }
                
                await setDoc(docRef, dataToSave);
                if (!silent) showToast("✅ 排課與設定已儲存至雲端", "success");
                
            } catch (error) {
                console.error("Save error:", error);
                if (!silent) showToast("❌ 儲存至雲端時發生錯誤", "error");
            } finally {
                if (!silent) {
                    const btn = document.querySelector('button[onclick="saveToCloud()"]');
                    if(btn) btn.innerText = "💾 儲存進度至雲端";
                }
            }
        };

        window.loadFromCloud = async function() {
            if (!user || !db) {
                showToast("⚠️ 未連接雲端，無法載入資料", "warning");
                return;
            }
            try {
                const { doc, getDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'scheduleData');
                const docSnap = await getDoc(docRef);
                
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if(data.scheduleA) scheduleA = JSON.parse(data.scheduleA);
                    if(data.scheduleB) scheduleB = JSON.parse(data.scheduleB);
                    if(data.teacherMetadata) teacherMetadata = JSON.parse(data.teacherMetadata);
                    if(data.startDate) document.getElementById('schedule-start-date').value = data.startDate;
                    if(data.suspendDates) document.getElementById('suspend-dates-input').value = data.suspendDates;
                    if(data.gasUrl && document.getElementById('payroll-gas-url')) document.getElementById('payroll-gas-url').value = data.gasUrl;
                    
                    showToast("☁️ 已成功載入雲端排課進度", "success");
                    
                    // 呼叫 UI 更新渲染函數
                    if(typeof updateScheduleDates === 'function') updateScheduleDates();
                    if(typeof renderTable === 'function') {
                        try {
                            renderTable('A', 1); renderTable('A', 2);
                            renderTable('B', 1); renderTable('B', 2);
                        } catch(e) {
                            console.warn("渲染表格暫時代替中", e);
                        }
                    }
                }
            } catch (error) {
                console.error("Load error:", error);
                showToast("❌ 載入雲端資料失敗", "error");
            }
        };

        // 監聽網頁載入後啟動 Firebase
        window.addEventListener('DOMContentLoaded', initFirebase);
        // --- 結束 Firebase 整合 ---

        function getScheduleDate(dayIndex) {
            const baseDate = new Date(document.getElementById('schedule-start-date').value);
            if (isNaN(baseDate.getTime())) return "";
            let offset = dayIndex >= 5 ? dayIndex + 2 : dayIndex;
            baseDate.setDate(baseDate.getDate() + offset);
            return `${baseDate.getMonth() + 1}/${baseDate.getDate()}`;
        }

        function getSuspendedDatesArray() {
            return (document.getElementById('suspend-dates-input').value || "").split(',').map(d=>d.trim()).filter(d=>d);
        }

        function updateScheduleDates() {} // Mock function to prevent error
        function renderTable(cls, week) {} // Mock function to prevent error
        function switchView(view) {} // Mock function to prevent error

        function openPurchaseModal() {
            document.getElementById('purchase-modal').classList.remove('hidden');
            if (document.getElementById('purchase-items-container').children.length === 0) addPurchaseItem();
        }
        
        function closePurchaseModal() { document.getElementById('purchase-modal').classList.add('hidden'); }
        
        function addPurchaseItem() {
            const container = document.getElementById('purchase-items-container');
            const row = document.createElement('div');
            row.className = "purchase-item-row grid grid-cols-12 gap-1 mb-1 items-center bg-gray-50 p-1 rounded border border-gray-200";
            row.innerHTML = `
                <div class="col-span-1 text-center text-xs font-bold text-gray-500">${container.children.length + 1}</div>
                <div class="col-span-3"><input type="text" class="p-name w-full border border-gray-300 rounded p-1 text-xs" placeholder="品名"></div>
                <div class="col-span-1"><input type="text" class="p-unit w-full border border-gray-300 rounded p-1 text-xs text-center" placeholder="式" value="式"></div>
                <div class="col-span-2"><input type="number" class="p-qty w-full border border-gray-300 rounded p-1 text-xs text-center" placeholder="數量" value="1" oninput="updatePurchaseTotal()"></div>
                <div class="col-span-2"><input type="number" class="p-price w-full border border-gray-300 rounded p-1 text-xs text-center" placeholder="單價" value="0" oninput="updatePurchaseTotal()"></div>
                <div class="col-span-2 text-right font-bold text-sm text-gray-700 p-amt-display">$0</div>
                <div class="col-span-1 text-center"><button onclick="this.parentElement.parentElement.remove(); updatePurchaseTotal();" class="text-red-500 font-bold hover:text-red-700">✖</button></div>
            `;
            container.appendChild(row);
        }

        function updatePurchaseTotal() {
            let total = 0;
            document.querySelectorAll('.purchase-item-row').forEach(row => {
                const q = parseFloat(row.querySelector('.p-qty').value) || 0;
                const p = parseFloat(row.querySelector('.p-price').value) || 0;
                row.querySelector('.p-amt-display').innerText = '$' + (q * p);
                total += (q * p);
            });
            document.getElementById('purchase-total-amount').innerText = total;
        }

        function exportPurchaseToGAS() {
            const gasUrl = document.getElementById('payroll-gas-url').value.trim();
            if (!gasUrl) { showToast("⚠️ 請先在印領清冊區塊設定 GAS 網址！", "warning"); return; }
            
            const items = [];
            document.querySelectorAll('.purchase-item-row').forEach(row => {
                const name = row.querySelector('.p-name').value;
                const unit = row.querySelector('.p-unit').value;
                const qty = parseFloat(row.querySelector('.p-qty').value) || 0;
                const price = parseFloat(row.querySelector('.p-price').value) || 0;
                if(name) items.push({ name, unit, qty, price, amt: qty*price, note: '' });
            });
            
            if (items.length === 0) { showToast("⚠️ 請輸入至少一筆明細！", "warning"); return; }
            
            const payload = {
                formType: "purchase",
                year: document.getElementById('purchase-year').value,
                projectName: document.getElementById('purchase-project-name').value,
                abstract: document.getElementById('purchase-abstract').value,
                classNote: document.getElementById('purchase-class-select').value,
                payerName: document.getElementById('purchase-payer-name').value,
                items: items
            };
            
            const btn = document.getElementById('btn-export-purchase');
            const originalText = btn.innerHTML;
            btn.innerHTML = "⏳ 匯出中..."; btn.disabled = true;
            
            fetch(gasUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
            .then(() => showToast("✅ 請購單已成功匯出至 Google Sheets", "success"))
            .catch(e => showToast("❌ 匯出失敗", "error"))
            .finally(() => { btn.innerHTML = originalText; btn.disabled = false; });
        }

        function openPayrollModal() { 
            onPayrollClassChange();
            document.getElementById('payroll-modal').classList.remove('hidden'); 
        }
        function closePayrollModal() { document.getElementById('payroll-modal').classList.add('hidden'); }
        function switchPayrollTab(tab) {
            document.getElementById('payroll-single-preview').classList.toggle('hidden', tab !== 'single');
            document.getElementById('payroll-summary-preview').classList.toggle('hidden', tab === 'single');
        }

        function generatePayrollData() {
            // Mock Data Generation for Payroll UI Testing
            return {
                "王小明": { main: { periods: 10, days: new Set([0,1,2]), units: new Set(['數學']) }, ta: { periods: 0, days: new Set(), units: new Set() } }
            };
        }

        function onPayrollClassChange() {
            const select = document.getElementById('payroll-teacher-select');
            select.innerHTML = '<option value="王小明">王小明</option>'; // Mock
            updatePayrollUI();
        }

        function onPayrollTeacherChange() { updatePayrollUI(); }

        function updatePayrollUI() {
            const payrollData = generatePayrollData();
            const tName = document.getElementById('payroll-teacher-select').value;
            let singleHtml = '';
            
            if (tName && payrollData[tName]) {
                const d = payrollData[tName];
                const mRate = parseInt(document.getElementById('payroll-main-rate').value) || 400;
                const tRate = parseInt(document.getElementById('payroll-ta-rate').value) || 200;
                const mGross = d.main.periods * mRate;
                const tGross = d.ta.periods * tRate;
                
                singleHtml = `
                    <div class="bg-white p-4 border rounded shadow-sm text-sm">
                        <h3 class="font-bold text-lg mb-2 text-indigo-800">📄 ${tName} 的印領清冊預覽</h3>
                        <div class="grid grid-cols-2 gap-4">
                            <div><strong>主教節數：</strong> ${d.main.periods} 節</div>
                            <div><strong>助教節數：</strong> ${d.ta.periods} 節</div>
                            <div><strong>主教金額：</strong> $${mGross}</div>
                            <div><strong>助教金額：</strong> $${tGross}</div>
                            <div class="col-span-2 text-right text-red-600 font-bold text-lg border-t pt-2">
                                實領總額： $${mGross + tGross}
                            </div>
                        </div>
                    </div>
                `;
            }
            document.getElementById('payroll-single-preview').innerHTML = singleHtml;
        }

        function exportToGoogleSheets() {
            const gasUrl = document.getElementById('payroll-gas-url').value.trim();
            if (!gasUrl) { showToast("⚠️ 請先設定 GAS 網址", "warning"); return; }
            showToast("✅ 印領清冊簽呈準備送出", "info");
        }

        function showToast(msg, type) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `p-3 rounded shadow-lg text-white font-bold transition-opacity duration-300 bg-${type==='error'?'red':type==='warning'?'yellow':type==='success'?'green':'blue'}-600`;
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        }
    </script>
</body>
